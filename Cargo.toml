[workspace]
members = ["crates/core", "crates/render"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
las-core = { path = "crates/core" }
las-render = { path = "crates/render" }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"

[profile.dev]
opt-level = 2
